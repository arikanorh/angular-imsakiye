<div class="page-wrapper">
  <div class="phone-frame">

    <div class="header-card">
      <div
        class="brand"
        (touchstart)="$event.preventDefault()"
        (pointerdown)="startBrandPress($event)"
        (pointerup)="cancelBrandPress()"
        (pointerleave)="cancelBrandPress()"
        (pointercancel)="cancelBrandPress()"
        (contextmenu)="$event.preventDefault()"
      >
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <rect width="24" height="24" fill="#0F7B6C" />
          <circle cx="12" cy="6.6" r="1.9" fill="#D8B26E" />
          <rect x="10.2" y="10.1" width="3.6" height="10.3" rx="1.8" fill="#FBF6EC" />
        </svg>
        <div class="app-title">İmsakiye</div>
      </div>
      <div class="city-picker">
        <label for="city" class="sr-only">Şehir seç</label>
        <select id="city" [(ngModel)]="city">
          @for (level of cities; track level) {
            <option [ngValue]="level">
              {{ level }}
            </option>
          }
        </select>
        <svg class="chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </div>
    </div>

    <div class="page-scroll">
      <router-outlet></router-outlet>
    </div>

    <div class="tab-bar">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="tab-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v4M4.2 10.2l1.4 1.4M18.4 10.2l1.4-1.4M2 18h20M6 18a6 6 0 0 1 12 0" /></svg>
        Bugün
      </a>
      <a routerLink="/takvim" routerLinkActive="active" class="tab-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3" /><path d="M3 9h18" /></svg>
        Takvim
      </a>
    </div>
  </div>

  @if (updateAvailable) {
    <div class="update-toast">
      <span>Yeni bir sürüm mevcut.</span>
      <button (click)="reloadForUpdate()">Yenile</button>
    </div>
  }

  @if (aboutOpen) {
    <div class="sheet-backdrop" (click)="closeAbout()"></div>
    <div class="about-sheet" role="dialog" aria-modal="true" aria-label="Hakkında">
      <div class="sheet-grab"></div>
      <div class="sheet-title">Hakkında</div>

      <div class="kv">
        <span>Sürüm</span>
        <b class="mono">{{ buildVersion }}</b>
      </div>
      <div class="kv">
        <span>Build</span>
        <b class="mono">{{ buildBranch }} · {{ buildTimestamp }}</b>
      </div>
      <div class="kv">
        <span>Gece modu</span>
        <div class="seg" role="radiogroup" aria-label="Gece modu">
          <button type="button" role="radio" [attr.aria-checked]="themeMode === 'light'" [class.on]="themeMode === 'light'" (click)="setTheme('light')">Açık</button>
          <button type="button" role="radio" [attr.aria-checked]="themeMode === 'auto'" [class.on]="themeMode === 'auto'" (click)="setTheme('auto')">Otomatik</button>
          <button type="button" role="radio" [attr.aria-checked]="themeMode === 'dark'" [class.on]="themeMode === 'dark'" (click)="setTheme('dark')">Koyu</button>
        </div>
      </div>
      <div class="kv">
        <span>Zaman simülasyonu</span>
        <button type="button" class="switch" role="switch" [attr.aria-checked]="simPanelOpen" [class.on]="simPanelOpen" (click)="simPanelOpen = !simPanelOpen" aria-label="Zaman simülasyonu"></button>
      </div>
      <div class="kv">
        <span>Şehir</span>
        <b>{{ city }}</b>
      </div>
    </div>
  }

  <app-admin-panel [mobileOpen]="simPanelOpen"></app-admin-panel>
</div>
